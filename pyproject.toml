[project]
name = "ha-silverline-hi"
version = "1.0.0"
description = "Home Assistant integration for Silverline Hi+ cooker hoods"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/silverline_hi"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "LOG",   # flake8-logging
    "PL",    # pylint
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D202",    # blank line after docstring
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "PLR0913", # too many arguments
    "PLR2004", # magic values
    "RUF012",  # HA entity class attributes are intentionally mutable defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
